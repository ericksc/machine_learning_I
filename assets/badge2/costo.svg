="24" fill="white" stroke="#e6bb26" stroke-width="3"/><text x="169" y="242.27" font-size="19" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">x₁</text><text x="245" y="266" font-size="16" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">w1</text><text x="55" y="318" font-size="12" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">Valor de</text><text x="55" y="333" font-size="12" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">entrada 2</text><path d="M192 321L309 321.0" fill="none" stroke="#4b80ad" stroke-width="3" marker-end="url(#blue)"/><circle cx="169" cy="321" r="24" fill="white" stroke="#e6bb26" stroke-width="3"/><text x="169" y="327.27" font-size="19" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">x₂</text><text x="245" y="321" font-size="16" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">w2</text><text x="55" y="404" font-size="12" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">Valor de</text><text x="55" y="419" font-size="12" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">entrada m</text><path d="M192 407L309 338.2" fill="none" stroke="#4b80ad" stroke-width="3" marker-end="url(#blue)"/><circle cx="169" cy="407" r="24" fill="white" stroke="#e6bb26" stroke-width="3"/><text x="169" y="413.27" font-size="19" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">xₘ</text><text x="245" y="387" font-size="16" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">wm</text><text x="169" y="370" font-size="24" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">⋮</text><circle cx="371" cy="321" r="59" fill="white" stroke="#16a450" stroke-width="2.5"/><text x="371" y="313" font-size="21" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">Σ wᵢxᵢ + b</text><text x="371" y="345" font-size="19" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">f(z) = z</text><path d="M430 321L546 321" fill="none" stroke="#4b80ad" stroke-width="3" marker-end="url(#blue)"/><circle cx="570" cy="321" r="24" fill="white" stroke="#e91920" stroke-width="3"/><text x="570" y="327.6" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">ŷ</text><text x="609" y="325" font-size="12" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">Valor de salida</text><path d="M540 310L432 310" fill="none" stroke="#7030a0" stroke-width="4" marker-end="url(#purple)"/><path d="M301 295L274 277" fill="none" stroke="#7030a0" stroke-width="4" marker-end="url(#purple)"/><path d="M300 316L274 316" fill="none" stroke="#7030a0" stroke-width="4" marker-end="url(#purple)"/><path d="M304 342L278 363" fill="none" stroke="#7030a0" stroke-width="4" marker-end="url(#purple)"/><circle cx="570" cy="420" r="24" fill="white" stroke="#e91920" stroke-width="3"/><text x="570" y="426.6" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">y</text><text x="609" y="425" font-size="12" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">Valor real</text><path d="M563 393L563 350" fill="none" stroke="#7030a0" stroke-width="4" marker-end="url(#purple)"/><path d="M578 350L578 391" fill="none" stroke="#e6bb26" stroke-width="4" marker-end="url(#gold)"/><rect x="600" y="350" width="104" height="44" fill="#d7c2ec" stroke="#9274b2"/><text x="652" y="378" font-size="16" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">C = ½(ŷ − y)²</text><path d="M507 281L507 202" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#black)"/><path d="M507 281L668 281" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#black)"/><rect x="551" y="234" width="20" height="47" fill="#00ade9"/><text x="576" y="251" font-size="14" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">ŷ</text><rect x="583" y="207" width="20" height="74" fill="#00a645"/><text x="608" y="224" font-size="14" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">y</text><rect x="636" y="191" width="20" height="90" fill="#9a84b4"/><text x="661" y="208" font-size="14" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">C</text><text x="506" y="165" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-family="Arial">Comparación esquemática</text><text x="744" y="231" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">Comparar el valor de predicción</text><text x="744" y="258" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">con el valor de referencia</text><text x="744" y="298" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">Observar si están cerca o hay</text><text x="744" y="325" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">mucha diferencia</text><text x="744" y="367" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">La diferencia se cuantifica con la</text><text x="744" y="394" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">función de costo</text><text x="744" y="435" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">Cuanto menor es el costo, mejor</text><text x="744" y="462" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">es el ajuste en estos datos</text><text x="744" y="502" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">El gradiente indica cómo cambiar</text><text x="744" y="529" font-size="22" fill="#333" text-anchor="start" font-weight="normal" font-family="Arial">los pesos para reducir el error</text><text x="744" y="570" font-size="22" fill="#333" text-anchor="start" font-weight="bold" font-family="Arial">La idea es cambiar los pesos para</text><text x="744" y="597" font-size="22" fill="#333" text-anchor="start" font-weight="bold" font-family="Arial">generar una predicción mejor</text><text x="744" y="624" font-size="22" fill="#333" text-anchor="start" font-weight="bold" font-family="Arial">(error menor)</text></g></svg>