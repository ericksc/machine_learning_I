<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="760" viewBox="0 0 1062 760" role="img" aria-labelledby="title"><title id="title">Precio de una casa con cuatro entradas y una neurona lineal</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#4b80ad" stroke-width="1.5"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7030a0" stroke-width="1.5"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e6bb26" stroke-width="1.5"/></marker><marker id="black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444" stroke-width="1.5"/></marker></defs><rect width="1062" height="760" fill="white"/><g font-family="Arial, sans-serif"><text x="25" y="73" font-size="62" fill="#404040" text-anchor="start" font-weight="300" font-family="Segoe UI">Ejemplo: Precio casa</text><text x="16" y="129" font-size="26" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">Una neurona lineal representa una regresión lineal múltiple</text><text x="16" y="168" font-size="24" fill="#db1010" text-anchor="start" font-weight="normal" font-family="Arial">Activación identidad: la salida conserva la suma ponderada</text><path d="M84 205L1048 205" fill="none" stroke="#888" stroke-width="1"/><text x="340" y="280" font-size="21" fill="#111" text-anchor="end" font-weight="normal" font-family="Arial">Área (pies²)</text><path d="M428 297L562 405.0" fill="none" stroke="#4b80ad" stroke-width="4" marker-end="url(#blue)"/><circle cx="397" cy="273" r="37" fill="white" stroke="#e6bb26" stroke-width="3"/><text x="397" y="281.58" font-size="26" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">x₁</text><text x="508" y="323" font-size="24" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">w₁</text><text x="340" y="390" font-size="21" fill="#111" text-anchor="end" font-weight="normal" font-family="Arial">Dormitorios</text><path d="M428 407L562 415.0" fill="none" stroke="#4b80ad" stroke-width="4" marker-end="url(#blue)"/><circle cx="397" cy="383" r="37" fill="white" stroke="#e6bb26" stroke-width="3"/><text x="397" y="391.58" font-size="26" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">x₂</text><text x="508" y="394" font-size="24" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">w₂</text><text x="340" y="500" font-size="21" fill="#111" text-anchor="end" font-weight="normal" font-family="Arial">Distancia a la ciudad (millas)</text><path d="M428 469L562 425.0" fill="none" stroke="#4b80ad" stroke-width="4" marker-end="url(#blue)"/><circle cx="397" cy="493" r="37" fill="white" stroke="#e6bb26" stroke-width="3"/><text x="397" y="501.58" font-size="26" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">x₃</text><text x="508" y="486" font-size="24" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">w₃</text><text x="340" y="612" font-size="21" fill="#111" text-anchor="end" font-weight="normal" font-family="Arial">Edad (años)</text><path d="M428 581L562 435.0" fill="none" stroke="#4b80ad" stroke-width="4" marker-end="url(#blue)"/><circle cx="397" cy="605" r="37" fill="white" stroke="#e6bb26" stroke-width="3"/><text x="397" y="613.58" font-size="26" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">x₄</text><text x="508" y="556" font-size="24" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">w₄</text><path d="M638 436L751 436" fill="none" stroke="#4b80ad" stroke-width="4" marker-end="url(#blue)"/><circle cx="600" cy="436" r="37" fill="white" stroke="#e91920" stroke-width="3"/><text x="600" y="444.25" font-size="25" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">ŷ</text><text x="675" y="407" font-size="19" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">Precio = w₁x₁ + w₂x₂ + w₃x₃ + w₄x₄ + b</text><text x="600" y="502" font-size="21" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">Sesgo b</text><path d="M360 681L362 705H432L434 681" fill="none" stroke="#333" stroke-width="3"/><text x="397" y="732" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">Capa de entrada</text><path d="M563 681L565 705H635L637 681" fill="none" stroke="#333" stroke-width="3"/><text x="600" y="732" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">Capa de salida</text></g></svg>