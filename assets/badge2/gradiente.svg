<svg xmlns="http://www.w3.org/2000/svg" width="1121" height="770" viewBox="0 0 1121 770" role="img" aria-labelledby="title"><title id="title">Descenso de gradiente con tres estados de una curva de costo</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#4b80ad" stroke-width="1.5"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7030a0" stroke-width="1.5"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e6bb26" stroke-width="1.5"/></marker><marker id="black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444" stroke-width="1.5"/></marker></defs><rect width="1121" height="770" fill="white"/><g font-family="Arial, sans-serif"><text x="28" y="58" font-size="63" fill="#404040" text-anchor="start" font-weight="300" font-family="Segoe UI">Gradiente descendente</text><text x="28" y="118" font-size="26" fill="#404040" text-anchor="start" font-weight="normal" font-family="Arial">Con una pérdida convexa, se busca el punto más bajo de la función de costo.</text><text x="28" y="154" font-size="26" fill="#404040" text-anchor="start" font-weight="normal" font-family="Arial">Una neurona lineal con MSE tiene esta propiedad.</text><text x="28" y="228" font-size="26" fill="#404040" text-anchor="start" font-weight="normal" font-family="Arial">Se calcula la derivada en un punto para obtener el gradiente.</text><text x="28" y="265" font-size="26" fill="#404040" text-anchor="start" font-weight="normal" font-family="Arial">La actualización avanza en la dirección contraria al gradiente.</text><text x="28" y="340" font-size="26" fill="#404040" text-anchor="start" font-weight="normal" font-family="Arial">Los pesos cambian en las direcciones que reducen el costo.</text><text x="28" y="377" font-size="26" fill="#404040" text-anchor="start" font-weight="normal" font-family="Arial">La tasa de aprendizaje controla el tamaño de cada paso.</text><text x="28" y="453" font-size="26" fill="#404040" text-anchor="start" font-weight="normal" font-family="Arial">La cantidad de pasos depende de los datos y de la tasa de aprendizaje.</text><path d="M26 727L26 592" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#black)"/><path d="M26 727L278 727" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#black)"/><text x="12" y="595" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">C</text><text x="282" y="745" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">ŷ</text><path d="M48 591Q155 832 262 592" fill="none" stroke="#222" stroke-width="2"/><path d="M16 618.1884H60.839999999999996" stroke="#666" stroke-dasharray="2 2" fill="none"/><circle cx="60.839999999999996" cy="618.1884" r="5.5" fill="red"/><path d="M53.349999999999994 602.7493749999999L74.75 643.734375" fill="none" stroke="#243cf4" stroke-width="3"/><path d="M72.84 620.1884q5 14 -11 17" fill="none" stroke="#00a55a" stroke-width="2"/><rect x="288" y="632" width="80" height="37" fill="#e0d3ef" stroke="#a185bf"/><text x="328" y="655" font-size="13" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">C = ½(ŷ − y)²</text><path d="M428 727L428 592" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#black)"/><path d="M428 727L680 727" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#black)"/><text x="414" y="595" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">C</text><text x="684" y="745" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">ŷ</text><path d="M450 591Q557 832 664 592" fill="none" stroke="#222" stroke-width="2"/><path d="M497 646.2711H636.1800000000001" stroke="#666" stroke-dasharray="2 2" fill="none"/><circle cx="636.1800000000001" cy="646.2711" r="5.5" fill="red"/><path d="M628.69 658.104775L650.09 621.167775" fill="none" stroke="#243cf4" stroke-width="3"/><path d="M648.1800000000001 648.2711q5 14 -11 17" fill="none" stroke="#00a55a" stroke-width="2"/><rect x="674" y="632" width="80" height="37" fill="#e0d3ef" stroke="#a185bf"/><text x="714" y="655" font-size="13" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">C = ½(ŷ − y)²</text><path d="M778 727L778 592" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#black)"/><path d="M778 727L1030 727" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#black)"/><text x="764" y="595" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">C</text><text x="1034" y="745" font-size="15" fill="#111" text-anchor="start" font-weight="normal" font-family="Arial">ŷ</text><path d="M800 591Q907 832 1014 592" fill="none" stroke="#222" stroke-width="2"/><polyline points="812.8399999999999,618.1884 986.1800000000001,646.2711 866.3399999999999,694.1958999999999 907.0,711.75" fill="none" stroke="#666" stroke-width="1.4"/><circle cx="812.8399999999999" cy="618.1884" r="5" fill="white" stroke="red" stroke-dasharray="2 2"/><circle cx="986.1800000000001" cy="646.2711" r="5" fill="white" stroke="red" stroke-dasharray="2 2"/><circle cx="866.3399999999999" cy="694.1958999999999" r="5" fill="white" stroke="red" stroke-dasharray="2 2"/><circle cx="907.0" cy="711.75" r="5.5" fill="red"/><rect x="1032" y="632" width="80" height="37" fill="#e0d3ef" stroke="#a185bf"/><text x="1072" y="655" font-size="13" fill="#111" text-anchor="middle" font-weight="normal" font-family="Arial">C = ½(ŷ − y)²</text></g></svg>